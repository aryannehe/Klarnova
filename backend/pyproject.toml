[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "BLE001",  # fail-safe layers deliberately catch broad exceptions (k8s/agents)
]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"app/schemas/__init__.py" = ["F401"]
"app/api/*" = ["B008"]
"app/core/rbac.py" = ["B008"]
"alembic/*" = ["E501"]
