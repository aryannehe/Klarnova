# Sample-app alert rules (KLR-B2). Fired alerts flow to Alertmanager → Klarnova webhook.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: klarnova-sample-alerts
  namespace: sample
  labels:
    release: kube-prometheus-stack
    app: kube-prometheus-stack
spec:
  groups:
    - name: klarnova-sample-apps
      rules:
        - alert: SampleAppDown
          expr: up{namespace="sample"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.job }} / {{ $labels.app }} is down"
            description: "Sample service {{ $labels.app }} has been unreachable for over a minute."
        - alert: SampleAppErrorRateHigh
          expr: |
            sum by (app, namespace) (rate(app_requests_total{status=~"5.."}[2m]))
              / (sum by (app, namespace) (rate(app_requests_total[2m])) > 0)
            > 0.05
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High error rate on {{ $labels.app }}"
            description: "{{ $labels.app }} is returning 5xx responses at a rate above 5%."
        - alert: SampleAppRestarting
          expr: |
            max by (pod, app, namespace) (
              increase(kube_pod_container_status_restarts_total{namespace="sample"}[10m]) > 0
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.app }} is crash-looping"
            description: "Pod {{ $labels.pod }} restarted repeatedly in the last 10 minutes."
        - alert: SampleAppHighCPU
          expr: |
            sum by (pod, app, namespace) (
              rate(container_cpu_usage_seconds_total{namespace="sample"}[2m])
            ) > 0.5
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High CPU on {{ $labels.app }}"
            description: "Pod {{ $labels.pod }} is consuming over 0.5 CPU cores."
