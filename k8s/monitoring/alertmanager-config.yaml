# Alertmanager → Klarnova webhook routing (KLR-B6)
# Lives in the sample namespace so the operator scopes the route to
# namespace="sample" (sample alerts carry that label). The webhook URL uses
# host.minikube.internal so the in-cluster Alertmanager can reach the backend
# running on the host (Phase 1). When Klarnova is deployed in-cluster, point
# this at the backend Service instead.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: klarnova-webhook
  namespace: sample
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: klarnova-webhook
    groupBy: ["alertname"]
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 10m
  receivers:
    - name: klarnova-webhook
      webhookConfigs:
        - url: http://host.minikube.internal:8000/api/v1/webhooks/alertmanager?token=klarnova-dev-token
          sendResolved: false
