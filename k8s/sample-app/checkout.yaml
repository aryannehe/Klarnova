# Checkout sample app — Deployment + Service + ConfigMap (KLR-B4)
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkout-config
  namespace: sample
data:
  LOG_LEVEL: "INFO"
  ERROR_RATE: "0"
  FAIL_MODE: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: sample
  labels:
    app: checkout
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: klarnova/checkout:phase1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: checkout-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: sample
  labels:
    app: checkout
spec:
  selector:
    app: checkout
  ports:
    - name: http
      port: 8000
      targetPort: 8000
