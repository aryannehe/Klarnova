apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "klarnova.name" . }}
  labels:
    {{- include "klarnova.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "klarnova.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "klarnova.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: klarnova-backend
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "klarnova.fullname" . }}
          env:
            - name: KB_REFRESH_INTERVAL
              value: {{ .Values.configmap.KB_REFRESH_INTERVAL | quote }}
          volumeMounts:
            - name: chroma-data
              mountPath: {{ .Values.persistence.mountPath }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: chroma-data
          persistentVolumeClaim:
            claimName: {{ include "klarnova.fullname" . }}-chroma
