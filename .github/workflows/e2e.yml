name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # nightly
  push:
    branches: [main, aryan-test-1]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (minikube)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      E2E_API_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:3000
      ALERTMANAGER_WEBHOOK_TOKEN: e2e-token
    steps:
      - uses: actions/checkout@v4

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          cpus: 2
          memory: 4096

      - name: Deploy demo app (sock-shop)
        run: |
          kubectl create namespace sock-shop --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n sock-shop -f https://raw.githubusercontent.com/microservices-demo/microservices-demo/master/deploy/kubernetes/complete-demo.yaml
          kubectl -n sock-shop wait --for=condition=Available deployment --all --timeout=300s

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Create backend venv (used by Playwright webServer)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-reports/e2e-results.csv
            test-reports/playwright-html/
            test-reports/e2e.db
          if-no-files-found: ignore
